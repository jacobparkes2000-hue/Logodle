<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f4f6" />
    <title>Logodle</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="style-overrides.css" />
  </head>
  <body>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <header><button id="archive-toggle" aria-label="Open archive" title="Archive"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4zM3 4h18v4H3zM9 12h6"/></svg></button><a class="brand" href="./"><img src="assets/logodle-mark.png" alt="" />LOGODLE</a></header>
    <main>
      <section id="game">
        <nav class="day-nav"><button id="previous" aria-label="Previous day">‹</button><div><small>DAILY LOGO QUIZ</small><h1 id="day-title">Loading…</h1></div><button id="next" aria-label="Next day">›</button></nav>
        <div class="progress"><span id="round-label"></span><i><b id="progress-fill"></b></i></div>
        <section class="logo-stage" aria-label="Mystery logo"><img id="logo" alt="Mystery logo" /></section>
        <p class="question">Which logo is this?</p>
        <div id="choices" class="choices" aria-label="Answer choices"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <div class="controls"><button id="give-up" class="muted">Back</button><button id="continue" disabled>Choose an answer</button></div>
      </section>
      <section id="archive" hidden><div class="archive-head"><div><small>PAST &amp; UPCOMING</small><h1>Archive</h1></div><button id="back">Back</button></div><div id="archive-list"></div></section>
    </main>
    <dialog id="results"><button id="close-results" class="close" aria-label="Close">×</button><small>QUIZ COMPLETE</small><h2>Nice work!</h2><strong id="score"></strong><p id="message"></p><button id="open-archive" class="muted full">Browse archive</button></dialog>
    <script src="app.js"></script>
  </body>
</html>
